<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Library | RGUKT HUB</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap');
        :root { --primary: #4e73df; --bg: #f4f7fe; --text: #1e293b; }
        * { box-sizing: border-box; font-family: 'Poppins', sans-serif; -webkit-tap-highlight-color: transparent; }
        body { margin: 0; background: var(--bg); color: var(--text); display: flex; justify-content: center; }
        .app-shell { width: 100%; max-width: 420px; min-height: 100vh; padding-bottom: 40px; }
        .header { background: linear-gradient(135deg, #4e73df, #22c55e); padding: 40px 25px 30px; border-bottom-left-radius: 35px; border-bottom-right-radius: 35px; color: white; box-shadow: 0 10px 20px rgba(78, 115, 223, 0.2); }
        .back-btn { background: rgba(255,255,255,0.2); width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; border-radius: 12px; margin-bottom: 20px; cursor: pointer; }
        .subject-container { padding: 25px 20px; }
        .subject-card { background: white; border-radius: 20px; margin-bottom: 15px; border: 1px solid #eef2f6; overflow: hidden; }
        .sub-head { padding: 20px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; font-weight: 600; font-size: 15px; }
        .units-grid { display: none; grid-template-columns: 1fr 1fr; gap: 10px; padding: 15px; background: #f8fafc; border-top: 1px solid #eee; }
        .unit-btn { background: white; border: 1px solid #e2e8f0; padding: 12px; border-radius: 12px; text-align: center; font-size: 13px; font-weight: 700; color: var(--primary); cursor: pointer; }
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); backdrop-filter: blur(5px); z-index: 1000; justify-content: center; align-items: center; }
        .modal { background: white; width: 85%; max-width: 350px; border-radius: 30px; padding: 30px; text-align: center; animation: popIn 0.3s; }
        @keyframes popIn { from { transform: scale(0.8); opacity: 0; } to { transform: scale(1); opacity: 1; } }
        .modal h2 { margin: 0; font-size: 18px; color: var(--primary); }
        .modal-btns { display: flex; flex-direction: column; gap: 12px; margin-top: 20px; }
        .dl-btn { text-decoration: none; padding: 15px; border-radius: 15px; font-weight: 700; font-size: 14px; }
        .mat-link { background: #eef2ff; color: var(--primary); border: 1px solid var(--primary); }
        .writ-link { background: var(--primary); color: white; }
        .dev-footer { text-align: center; font-size: 10px; opacity: 0.5; text-transform: uppercase; margin-top: 20px; }
    </style>
</head>
<body>
<div class="modal-overlay" id="modalOverlay">
    <div class="modal">
        <h2 id="modalUnitTitle">Unit 1</h2>
        <p id="modalSubTitle" style="font-size:12px; opacity:0.6">Subject Name</p>
        <div class="modal-btns">
            <a href="#" id="matLink" class="dl-btn mat-link" target="_blank">Material Content</a>
            <a href="#" id="writLink" class="dl-btn writ-link" target="_blank">Written Notes</a>
        </div>
        <p onclick="closeModal()" style="margin-top:20px; font-size:12px; font-weight:700; color:#999; cursor:pointer">CLOSE</p>
    </div>
</div>
<div class="app-shell">
    <div class="header">
        <div class="back-btn" onclick="history.back()">←</div>
        <h2 id="b-title">Branch</h2><p id="s-title" style="margin:5px 0 0; opacity:0.8; font-size:13px">Semester</p>
    </div>
    <div class="subject-container" id="container"></div>
    <div class="dev-footer">Developed by <b>Thushanth</b><br>RGUKTian | 2024 Batch</div>
</div>
<script>
    function generateUnits() { 
        let units = {}; 
        for(let i=1; i<=6; i++) { 
            units[`Unit ${i}`] = {"M": "#", "W": "#"}; 
        } 
        return units; 
    }

    const academicData = {
        "E1": {
            "CSE": { "Sem-1": { "C & LA": generateUnits(), "BEEE": generateUnits(), "PSTC": generateUnits(), "EGCD": generateUnits() }, "Sem-2": { "DM": generateUnits(), "EP": generateUnits(), "OOPS": generateUnits(), "DS": generateUnits() } },
            "ECE": { "Sem-1": { "DEMC": generateUnits(), "ET": generateUnits(), "EP": generateUnits() }, "Sem-2": { "MM": generateUnits(), "EDC": generateUnits(), "NT": generateUnits() } },
            "EEE": { "Sem-1": { "DEMC": generateUnits(), "EP": generateUnits(), "ET": generateUnits() }, "Sem-2": { "MM": generateUnits(), "DLD": generateUnits(), "EDC": generateUnits() } },
            "CIVIL": { "Sem-1": { "EC": generateUnits(), "DEMC": generateUnits(), "EGCD": generateUnits() }, "Sem-2": { "EP": generateUnits(), "MM": generateUnits(), "BEEE": generateUnits() } },
            "CHEMICAL": { "Sem-1": { "DEMC": generateUnits(), "CE": generateUnits(), "OC": generateUnits() }, "Sem-2": { "MM": generateUnits(), "EP": generateUnits(), "CPC": generateUnits() } },
            "AIML": { "Sem-1": { "Intro to AI": generateUnits(), "Python": generateUnits(), "Math-I": generateUnits() }, "Sem-2": { "Machine Learning": generateUnits(), "Data Stats": generateUnits() } },
            "METALLURGY": { "Sem-1": { "Physical Metallurgy": generateUnits(), "Engg Chemistry": generateUnits() }, "Sem-2": { "Mineral Processing": generateUnits(), "Thermodynamics": generateUnits() } },
            "MECHANICAL": { "Sem-1": { "Engg Mechanics": generateUnits(), "Workshop": generateUnits() }, "Sem-2": { "Thermo-I": generateUnits(), "Materials": generateUnits() } }
        },
        "E2": {
            "CSE": { "Sem-1": { "P & S": generateUnits(), "DAA": generateUnits(), "DBMS": generateUnits() }, "Sem-2": { "WEB": generateUnits(), "CD": generateUnits(), "COA": generateUnits() } },
            "ECE": { "Sem-1": { "DLD": generateUnits(), "DSP": generateUnits(), "AEC": generateUnits() }, "Sem-2": { "LIC": generateUnits(), "EWGM": generateUnits(), "RL": generateUnits() } },
            "EEE": { "Sem-1": { "AEC": generateUnits(), "SS": generateUnits(), "EM": generateUnits() }, "Sem-2": { "ML": generateUnits(), "PE": generateUnits(), "CS": generateUnits() } },
            "CIVIL": { "Sem-1": { "BMC": generateUnits(), "CT": generateUnits(), "MOF": generateUnits() }, "Sem-2": { "HE": generateUnits(), "SA": generateUnits(), "WRE": generateUnits() } },
            "CHEMICAL": { "Sem-1": { "MT": generateUnits(), "HT": generateUnits(), "MUO": generateUnits() }, "Sem-2": { "CRE-1": generateUnits(), "MTO-1": generateUnits(), "TD-2": generateUnits() } }
        },
        "E3": {
            "CSE": { "Sem-1": { "AI": generateUnits(), "CN": generateUnits(), "OS": generateUnits() }, "Sem-2": { "Cloud": generateUnits(), "Security": generateUnits() } }
            // Add other branches for E3 here
        },
        "E4": {
            "CSE": { "Sem-1": { "Big Data": generateUnits(), "Project-I": generateUnits() }, "Sem-2": { "Internship": generateUnits(), "Final Project": generateUnits() } }
            // Add other branches for E4 here
        }
    };

    window.onload = function() {
        const p = new URLSearchParams(window.location.search);
        const y = p.get('year'), b = p.get('branch'), s = p.get('sem');
        
        if (!y || !b || !s) {
            window.location.href = "dashboard.html";
            return;
        }

        document.getElementById('b-title').innerText = `${y} - ${b}`;
        document.getElementById('s-title').innerText = s;
        const container = document.getElementById('container');

        if (academicData[y] && academicData[y][b] && academicData[y][b][s]) {
            const subs = academicData[y][b][s];
            for (let sub in subs) {
                let unitsHTML = '';
                for (let unit in subs[sub]) {
                    unitsHTML += `<div class="unit-btn" onclick="openModal('${sub}', '${unit}', '${subs[sub][unit].M}', '${subs[sub][unit].W}')">${unit}</div>`;
                }
                container.innerHTML += `<div class="subject-card"><div class="sub-head" onclick="toggleUnits(this)">${sub} <span>▼</span></div><div class="units-grid">${unitsHTML}</div></div>`;
            }
        } else { 
            container.innerHTML = "<p style='text-align:center; padding:50px; opacity:0.5'>📂 Subjects coming soon!</p>"; 
        }
    };

    function toggleUnits(el) { 
        const grid = el.nextElementSibling; 
        const isVisible = grid.style.display === 'grid'; 
        document.querySelectorAll('.units-grid').forEach(g => g.style.display = 'none'); 
        grid.style.display = isVisible ? 'none' : 'grid'; 
    }

    function openModal(sub, unit, mat, writ) { 
        document.getElementById('modalUnitTitle').innerText = unit; 
        document.getElementById('modalSubTitle').innerText = sub; 
        document.getElementById('matLink').href = mat; 
        document.getElementById('writLink').href = writ; 
        document.getElementById('modalOverlay').style.display = 'flex'; 
    }

    function closeModal() { 
        document.getElementById('modalOverlay').style.display = 'none'; 
    }
</script>
</body>
</html>
