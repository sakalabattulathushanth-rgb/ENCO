<!DOCTYPE html>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap');
        :root { --primary: #4e73df; --bg: #f4f7fe; --text: #1e293b; }
        * { box-sizing: border-box; font-family: 'Poppins', sans-serif; -webkit-tap-highlight-color: transparent; }
        body { margin: 0; background: var(--bg); color: var(--text); display: flex; justify-content: center; }
        .app-shell { width: 100%; max-width: 420px; min-height: 100vh; padding-bottom: 40px; }
        .header { background: linear-gradient(135deg, #4e73df, #22c55e); padding: 40px 25px 30px; border-bottom-left-radius: 35px; border-bottom-right-radius: 35px; color: white; box-shadow: 0 10px 20px rgba(78, 115, 223, 0.2); }
        .back-btn { background: rgba(255,255,255,0.2); width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; border-radius: 12px; margin-bottom: 20px; cursor: pointer; }
        .subject-container { padding: 25px 20px; }
        .subject-card { background: white; border-radius: 20px; margin-bottom: 15px; border: 1px solid #eef2f6; overflow: hidden; }
        .sub-head { padding: 20px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; font-weight: 600; font-size: 15px; }
        .units-grid { display: none; grid-template-columns: 1fr 1fr; gap: 10px; padding: 15px; background: #f8fafc; border-top: 1px solid #eee; }
        .unit-btn { background: white; border: 1px solid #e2e8f0; padding: 12px; border-radius: 12px; text-align: center; font-size: 13px; font-weight: 700; color: var(--primary); cursor: pointer; }
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); backdrop-filter: blur(5px); z-index: 1000; justify-content: center; align-items: center; }
        .modal { background: white; width: 85%; max-width: 350px; border-radius: 30px; padding: 30px; text-align: center; animation: popIn 0.3s; }
        @keyframes popIn { from { transform: scale(0.8); opacity: 0; } to { transform: scale(1); opacity: 1; } }
        .modal h2 { margin: 0; font-size: 18px; color: var(--primary); }
        .modal-btns { display: flex; flex-direction: column; gap: 12px; margin-top: 20px; }
        .dl-btn { text-decoration: none; padding: 15px; border-radius: 15px; font-weight: 700; font-size: 14px; }
        .mat-link { background: #eef2ff; color: var(--primary); border: 1px solid var(--primary); }
        .writ-link { background: var(--primary); color: white; }
        .dev-footer { text-align: center; font-size: 10px; opacity: 0.5; text-transform: uppercase; margin-top: 20px; }
    </style>
</head>

        } else { container.innerHTML = "<p style='text-align:center; padding:50px; opacity:0.5'>📂 Subjects coming soon!</p>"; }
    };

    function toggleUnits(el) { const grid = el.nextElementSibling; const isVisible = grid.style.display === 'grid'; document.querySelectorAll('.units-grid').forEach(g => g.style.display = 'none'); grid.style.display = isVisible ? 'none' : 'grid'; }
    
    function openModal(sub, unit, mat, writ) {
