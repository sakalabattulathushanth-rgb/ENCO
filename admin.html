<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Hub | Control Panel</title>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;800&display=swap');
        :root { --primary: #4e73df; --accent: #22c55e; --pink: #e73c7e; --bg: #f4f7fe; }
        * { box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        body { margin: 0; background: var(--bg); display: flex; justify-content: center; padding: 20px; }
        .shell { width: 100%; max-width: 500px; }
        .header { text-align: center; margin-bottom: 25px; }
        .header h1 { font-size: 24px; font-weight: 800; color: var(--primary); margin: 0; }
        .admin-nav { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 25px; }
        .nav-card { background: white; padding: 20px; border-radius: 20px; text-align: center; cursor: pointer; border: 2px solid transparent; transition: 0.3s; box-shadow: 0 8px 20px rgba(0,0,0,0.05); }
        .nav-card.active { border-color: var(--primary); transform: translateY(-5px); }
        .nav-card h3 { margin: 0; font-size: 14px; font-weight: 800; color: #444; }
        .nav-card span { font-size: 24px; display: block; margin-bottom: 5px; }
        .data-window { background: white; border-radius: 25px; padding: 20px; min-height: 300px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); }
        .tab-content { display: none; animation: fadeIn 0.4s ease; }
        .tab-content.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .card { background: #f8fafc; padding: 15px; border-radius: 15px; margin-bottom: 12px; border-left: 5px solid #ddd; }
        .query-item { border-left-color: var(--pink); }
        .login-item { border-left-color: var(--primary); }
        .dev-footer { margin-top: 30px; text-align: center; font-size: 10px; opacity: 0.5; }
    </style>
</head>
<body>
<div class="shell">
    <div class="header"><h1>Admin Hub</h1></div>
    <div class="admin-nav">
        <div class="nav-card active" onclick="switchTab('logins', this)"><span>📊</span><h3>LOGINS</h3></div>
        <div class="nav-card" onclick="switchTab('queries', this)"><span>💬</span><h3>QUERIES</h3></div>
    </div>
    <div class="data-window">
        <div id="logins" class="tab-content active"><div id="userList">Loading...</div></div>
        <div id="queries" class="tab-content"><div id="queryList">Loading...</div></div>
    </div>
    <div class="dev-footer">Developed by <b>Thushanth</b></div>
</div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyCdZU9rZL72EOXIR9UfmZ7wFyv_pQAa0XY",
        authDomain: "rgukt-hub-pro.firebaseapp.com",
        databaseURL: "https://rgukt-hub-pro-default-rtdb.firebaseio.com",
        projectId: "rgukt-hub-pro",
        storageBucket: "rgukt-hub-pro.firebasestorage.app",
        messagingSenderId: "395597268656",
        appId: "1:395597268656:web:c2ac6e8fb36e7edebc9d75"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    function switchTab(tabId, el) {
        document.querySelectorAll('.tab-content').forEach(tab => tab.classList.remove('active'));
        document.querySelectorAll('.nav-card').forEach(card => card.classList.remove('active'));
        document.getElementById(tabId).classList.add('active');
        el.classList.add('active');
    }

    db.ref('logins').on('value', (snapshot) => {
        const container = document.getElementById('userList');
        container.innerHTML = "";
        const data = snapshot.val();
        if(!data) { container.innerHTML = "<p style='text-align:center; opacity:0.5'>No logins yet.</p>"; return; }
        Object.values(data).reverse().forEach(entry => {
            container.innerHTML += `
                <div class="card login-item">
                    <b style="color: #333; font-size: 14px;">${entry.name}</b><br>
                    <small style="color: #888; font-size: 11px;">Entered at: ${entry.time}</small>
                </div>`;
        });
    });

    db.ref('queries').on('value', (snap) => {
        const container = document.getElementById('queryList');
        container.innerHTML = "";
        const data = snap.val();
        if(!data) { container.innerHTML = "<p style='text-align:center; opacity:0.5'>No queries yet.</p>"; return; }
        Object.values(data).reverse().forEach(q => {
            container.innerHTML += `
                <div class="card query-item">
                    <b style="font-size:10px; color:var(--pink);">${q.user.toUpperCase()}</b>
                    <p style="margin:5px 0 0; font-size:13px; color:#444;">${q.text}</p>
                    <small style="font-size:9px; color:#999;">${q.timestamp}</small>
                </div>`;
        });
    });
</script>
</body>
</html>
