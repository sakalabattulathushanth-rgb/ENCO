<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Hub</title>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;800&display=swap');
        body { background: #f4f7fe; font-family: 'Poppins', sans-serif; padding: 20px; display: flex; justify-content: center; }
        .shell { width: 100%; max-width: 500px; }
        .nav { display: flex; gap: 10px; margin-bottom: 20px; }
        .btn { flex: 1; padding: 15px; border-radius: 15px; border: none; background: white; font-weight: 800; cursor: pointer; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
        .btn.active { background: #4e73df; color: white; }
        .card { background: white; padding: 15px; border-radius: 20px; margin-bottom: 10px; border-left: 5px solid #4e73df; }
        .tab { display: none; }
        .tab.active { display: block; }
    </style>
</head>
<body>
<div class="shell">
    <div class="nav">
        <button class="btn active" onclick="show('logins', this)">LOGINS</button>
        <button class="btn" onclick="show('queries', this)">QUERIES</button>
    </div>
    <div id="logins" class="tab active"><div id="l-list">Loading...</div></div>
    <div id="queries" class="tab"><div id="q-list">Loading...</div></div>
</div>
<script>
    const firebaseConfig = { apiKey: "AIzaSyCdZU9rZL72EOXIR9UfmZ7wFyv_pQAa0XY", authDomain: "rgukt-hub-pro.firebaseapp.com", databaseURL: "https://rgukt-hub-pro-default-rtdb.firebaseio.com", projectId: "rgukt-hub-pro", storageBucket: "rgukt-hub-pro.firebasestorage.app", messagingSenderId: "395597268656", appId: "1:395597268656:web:c2ac6e8fb36e7edebc9d75" };
    firebase.initializeApp(firebaseConfig); const db = firebase.database();
    function show(id, el) { 
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active')); 
        document.querySelectorAll('.btn').forEach(b => b.classList.remove('active'));
        document.getElementById(id).classList.add('active'); el.classList.add('active');
    }
    db.ref('logins').on('value', snap => {
        let h = ""; snap.forEach(c => { h = `<div class="card"><b>${c.val().name}</b><br><small>${c.val().time}</small></div>` + h; });
        document.getElementById('l-list').innerHTML = h || "No logins";
    });
    db.ref('queries').on('value', snap => {
        let h = ""; snap.forEach(c => { h = `<div class="card" style="border-color:#e73c7e"><b>${c.val().user}</b><p>${c.val().text}</p></div>` + h; });
        document.getElementById('q-list').innerHTML = h || "No queries";
    });
</script>
</body>
</html>
