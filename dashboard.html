<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ENCO | Dashboard</title>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;800&display=swap');
        :root { --primary: #4e73df; --glass: rgba(255, 255, 255, 0.85); --border: rgba(255, 255, 255, 0.2); }
        * { box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        
        body { 
            margin: 0; padding: 0; min-height: 100vh; 
            background: radial-gradient(at top left, #667eea, transparent), radial-gradient(at bottom right, #4e73df, transparent); 
            background-color: #1a1a2e; display: flex; justify-content: center; overflow-x: hidden; 
        }
        
        .app-shell { 
            width: 100%; max-width: 420px; background: rgba(255, 255, 255, 0.1); 
            backdrop-filter: blur(20px); min-height: 100vh; display: flex; flex-direction: column; color: white; padding-bottom: 30px;
        }
        
        .header { padding: 45px 25px 25px; display: flex; justify-content: space-between; align-items: center; }
        .logout-pill { background: rgba(255, 255, 255, 0.15); padding: 8px 16px; border-radius: 12px; font-size: 11px; font-weight: 700; cursor: pointer; border: 1px solid var(--border); }

        .info-card, .selection-group { background: var(--glass); border-radius: 30px; padding: 25px; margin: 0 25px 20px; color: #333; box-shadow: 0 10px 30px rgba(0,0,0,0.2); }
        .info-card h3 { margin: 0 0 10px; color: var(--primary); font-size: 18px; font-weight: 800; }
        .info-card p { margin: 0; font-size: 13px; line-height: 1.6; opacity: 0.8; font-weight: 500; }

        label { display: block; font-size: 10px; font-weight: 800; color: #999; margin-bottom: 8px; letter-spacing: 1.5px; }
        select { width: 100%; padding: 15px; border-radius: 16px; border: 2px solid #f0f2f5; margin-bottom: 20px; outline: none; background: #fff; font-weight: 600; color: #333; }
        
        .fetch-btn { background: linear-gradient(135deg, #4e73df, #22c55e); color: white; border: none; width: 100%; padding: 18px; border-radius: 20px; font-weight: 700; cursor: pointer; font-size: 16px; box-shadow: 0 10px 20px rgba(78, 115, 223, 0.3); }

        .complaint-box { background: rgba(255, 255, 255, 0.1); border-radius: 30px; padding: 25px; margin: 0 25px 20px; border: 1px solid var(--border); }
        textarea { width: 100%; background: rgba(255,255,255,0.05); border: 1px solid var(--border); border-radius: 15px; padding: 12px; color: white; resize: none; margin-bottom: 12px; outline: none; }
        .submit-q { background: white; color: #1a1a2e; border: none; padding: 12px; border-radius: 12px; font-weight: 700; width: 100%; cursor: pointer; }
        
        .dev-footer { margin-top: auto; padding: 20px; text-align: center; font-size: 10px; opacity: 0.6; text-transform: uppercase; }
    </style>
</head>
<body>
<div class="app-shell">
    <div class="header">
        <div class="welcome-msg">
            <h2 id="greet" style="margin:0">Hello,</h2>
            <p id="user-name" style="margin:0; opacity:0.8">RGUKTian</p>
        </div>
        <div class="logout-pill" onclick="logout()">LOGOUT</div>
    </div>

    <div class="info-card">
        <h3>About ENCO</h3>
        <p>Premium gateway for RGUKTians. Select your details to access organized engineering materials and notes.</p>
    </div>

    <div class="selection-group">
        <label>SELECT YEAR</label>
        <select id="year">
            <option value="E1">Engineering 1st Year (E1)</option>
            <option value="E2">Engineering 2nd Year (E2)</option>
            <option value="E3">Engineering 3rd Year (E3)</option>
            <option value="E4">Engineering 4th Year (E4)</option>
        </select>
        
        <label>SELECT BRANCH</label>
        <select id="branch">
            <option value="AIML">AIML</option>
            <option value="CSE">CSE</option>
            <option value="ECE">ECE</option>
            <option value="EEE">EEE</option>
            <option value="CIVIL">CIVIL</option>
            <option value="CHEMICAL">CHEMICAL</option>
            <option value="METALLURGY">METALLURGY</option>
            <option value="MECHANICAL">MECHANICAL</option>
        </select>
        
        <label>SELECT SEMESTER</label>
        <select id="sem">
            <option value="Sem-1">SEMESTER 1</option>
            <option value="Sem-2">SEMESTER 2</option>
        </select>
        
        <button class="fetch-btn" onclick="go()">OPEN CONTENT ➔</button>
    </div>

    <div class="complaint-box">
        <p style="margin:0 0 10px; font-size:13px; font-weight:600">Complaints or Queries?</p>
        <textarea id="complaintInput" rows="3" placeholder="Describe your issue..."></textarea>
        <button class="submit-q" onclick="sendQuery()">Send to Admin</button>
    </div>
    
    <div class="dev-footer">Developed by <b>Thushanth</b></div>
</div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyCdZU9rZL72EOXIR9UfmZ7wFyv_pQAa0XY",
        authDomain: "rgukt-hub-pro.firebaseapp.com",
        databaseURL: "https://rgukt-hub-pro-default-rtdb.firebaseio.com",
        projectId: "rgukt-hub-pro",
        storageBucket: "rgukt-hub-pro.firebasestorage.app",
        messagingSenderId: "395597268656",
        appId: "1:395597268656:web:c2ac6e8fb36e7edebc9d75"
    };

    if (!firebase.apps.length) { firebase.initializeApp(firebaseConfig); }
    const db = firebase.database();

    window.addEventListener('load', function() {
        const name = localStorage.getItem("rgukt_user");
        if (!name) {
            window.location.replace("index.html");
            return;
        } 
        document.getElementById('user-name').innerText = name;
        const hrs = new Date().getHours();
        document.getElementById('greet').innerText = hrs < 12 ? "Good Morning," : hrs < 17 ? "Good Afternoon," : "Good Evening,";
    });

    function logout() { 
        localStorage.removeItem("rgukt_user"); 
        window.location.replace("index.html"); 
    }

    function go() { 
        const y = document.getElementById('year').value;
        const b = document.getElementById('branch').value;
        const s = document.getElementById('sem').value;
        window.location.href = `resources.html?year=${y}&branch=${b}&sem=${s}`; 
    }

    function sendQuery() {
        const msg = document.getElementById('complaintInput').value;
        if(msg.trim().length > 3) {
            db.ref('queries').push({ 
                user: localStorage.getItem("rgukt_user"), 
                text: msg, 
                timestamp: new Date().toLocaleString() 
            }).then(() => { 
                alert("Sent to Admin!"); 
                document.getElementById('complaintInput').value = ""; 
            });
        }
    }
</script>
</body>
</html>
